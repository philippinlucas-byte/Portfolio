<style>
:root{--paper:#F0F9FB;--ink:#012C50;--blue:#01497C;--accent:#4BA2C5}
*{box-sizing:border-box}
html,body{margin:0;width:1440px;height:900px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font:16px/1.5 'Geist',sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:var(--paper)}
a{color:inherit;text-decoration:none;text-underline-offset:7px}
a:focus-visible{outline:2px solid var(--blue);outline-offset:8px}
header{height:108px;margin:0 54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #01497c30}
.brand{display:block;width:180px;height:60px;object-fit:contain}
nav{display:flex;align-items:center;gap:46px;font-size:15px}
nav a{padding:10px 0}nav a:first-child{border-bottom:1px solid var(--ink)}
nav a:hover{color:var(--blue);text-decoration:underline}
.intro{height:232px;margin:0 54px;display:flex;align-items:center;justify-content:space-between}
h1{font:54px/1.13 'Gloock',serif;font-weight:400;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 span{display:block}
.intro p{font-size:17px;margin:57px 6px 0 35px;color:var(--blue)}
main{margin:0 54px;display:grid;grid-template-columns:1.9fr 1fr;gap:48px}
article{min-width:0}article+article{padding-top:138px}
.work{display:block;width:100%;aspect-ratio:1280/722;object-fit:contain}
.caption{display:flex;justify-content:space-between;align-items:baseline;gap:22px;padding-top:19px}
h2{margin:0;font:400 20px/1.4 'Geist',sans-serif;letter-spacing:-.02em}
article+article h2{max-width:330px}
time{font-size:14px;color:var(--blue);font-variant-numeric:tabular-nums}
.project:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
</style>
</head>
